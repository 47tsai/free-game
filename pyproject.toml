[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free-game"
version = "0.1.0"
description = "4Gamers free game catalog with FGC claim sync"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5"
]

[project.scripts]
free-game = "free_game.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
