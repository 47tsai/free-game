name = "chi-free-game-api"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true

[triggers]
crons = ["17 */6 * * *"]

routes = [
  { pattern = "fg-api.chi.qzz.io", custom_domain = true }
]

[vars]
APP_ORIGIN = "https://fg.chi.qzz.io"
CHI_AUTH_URL = "https://auth.chi.qzz.io"
CHI_CLIENT_ID = "REPLACE_WITH_CHIAUTH_CLIENT_ID"
