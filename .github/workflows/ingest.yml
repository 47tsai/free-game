name: 4Gamers RSS Ingestion

on:
  schedule:
    # UTC+8 00:00, 06:00, 12:00, 18:00
    - cron: "0 4,10,16,22 * * *"
  workflow_dispatch:

concurrency:
  group: free-game-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Read 4Gamers, persist games, and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: free-game ingest
