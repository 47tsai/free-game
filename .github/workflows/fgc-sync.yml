name: FGC Claim Sync

on:
  schedule:
    # UTC+9 00:00, 06:00, 12:00, 18:00
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: free-game-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Read FGC ntfy claims, update games, and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: free-game fgc-sync
