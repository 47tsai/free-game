<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Free Game｜免費遊戲收藏</title>
<style>
:root{font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:#e8edf7;background:#10141d;color-scheme:dark;--muted:#9aa6ba;--line:#293244;--surface:#171e2a;--accent:#8eb7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c2a40 0,#10141d 52rem);min-height:100vh}
header{max-width:1120px;margin:auto;padding:42px 24px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}
h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.04em;margin:0}header p{color:var(--muted);margin:8px 0 0}
button,a{font:inherit}button{border:1px solid #40516b;background:#26364e;color:#edf4ff;border-radius:10px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#d8e7ff;color:#17253a;border-color:#d8e7ff;font-weight:700}
main{max-width:1120px;margin:auto;padding:0 24px 64px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:8px 0 20px}.summary{color:var(--muted);font-size:.92rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.card{background:linear-gradient(160deg,#1b2432,#151b26);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}.cover{width:100%;aspect-ratio:16/9;object-fit:cover;background:#252f40;display:block}.body{padding:15px}.title-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-weight:750;font-size:1.08rem;line-height:1.4}.platform{color:var(--muted);font-size:.83rem;margin-top:5px}.status{white-space:nowrap;border-radius:999px;padding:4px 9px;font-size:.76rem;background:#44351c;color:#ffd88b}.status.done{background:#173e32;color:#a5f0ce}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.links a{color:#b9d3ff;text-decoration:none;border:1px solid #354762;padding:7px 9px;border-radius:8px;font-size:.82rem}.claim{width:100%;margin-top:12px}.muted{color:var(--muted)}.empty{border:1px dashed #3b4659;border-radius:14px;padding:36px;text-align:center;color:var(--muted);grid-column:1/-1}.notice{color:#ffc7a6;font-size:.9rem;min-height:1.4em}.hide{display:none!important}
@media(max-width:600px){header{padding-top:28px;align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div><h1>Free Game</h1><p>免費遊戲清單與領取狀態</p></div>
  <button id="login" class="primary">使用 Chi Auth 登入</button>
</header>
<main>
  <div class="toolbar"><div id="summary" class="summary">正在讀取遊戲資料…</div><div id="notice" class="notice" role="status"></div></div>
  <section id="games" class="grid"></section>
</main>
<script>
const API="/api";
const AUTH="https://auth.chi.qzz.io";
let accessToken=null;
let authClientId=null;
const $=id=>document.getElementById(id);
function b64url(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function say(message){$("notice").textContent=message||""}
async function digest(value){return b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value)))}
async function login(){
 if(!authClientId){say("Chi Auth 尚未完成應用設定。");return}
 const bytes=crypto.getRandomValues(new Uint8Array(48));
 const verifier=b64url(bytes);
 const state=b64url(crypto.getRandomValues(new Uint8Array(24)));
 sessionStorage.setItem("fg_pkce_verifier",verifier);
 sessionStorage.setItem("fg_oauth_state",state);
 const redirect=location.origin+"/";
 const params=new URLSearchParams({response_type:"code",client_id:authClientId,redirect_uri:redirect,code_challenge:await digest(verifier),code_challenge_method:"S256",state});
 location.href=AUTH+"/api/authorize?"+params.toString();
}
async function finishLogin(){
 const params=new URLSearchParams(location.search);
 const code=params.get("code");
 if(!code)return;
 const state=params.get("state");
 const expected=sessionStorage.getItem("fg_oauth_state");
 const verifier=sessionStorage.getItem("fg_pkce_verifier");
 sessionStorage.removeItem("fg_oauth_state");sessionStorage.removeItem("fg_pkce_verifier");
 if(!state||state!==expected||!verifier){say("登入驗證失敗，請重新登入。");return}
 try{
  const response=await fetch(AUTH+"/api/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:authClientId,code,redirect_uri:location.origin+"/",code_verifier:verifier})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"登入失敗");
  accessToken=data.access_token;history.replaceState({}, "", location.pathname);$("login").textContent="已登入 Chi Auth";say("登入成功，可以手動標記領取狀態。");
 }catch(error){say(error.message)}
}
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function safeLink(label,url){if(!url||!/^https:\/\//i.test(url))return null;const a=element("a","",label);a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a}
async function markClaimed(game,button){
 if(!accessToken){say("請先使用 Chi Auth 登入。");return}
 button.disabled=true;
 try{const response=await fetch(API+"/games/"+encodeURIComponent(game.id)+"/claim",{method:"POST",headers:{Authorization:"Bearer "+accessToken}});
 const data=await response.json();if(!response.ok)throw new Error(data.error||"更新失敗");
 game.claim_status="claimed";game.claim_source="manual";game.claimed_at=data.game.claimed_at;renderGames(window.currentGames);say("已標記為已領取。");
 }catch(error){say(error.message);button.disabled=false}
}
function renderGames(games){
 window.currentGames=games;$("games").replaceChildren();
 $("summary").textContent="共 "+games.length+" 款遊戲 · 已領取 "+games.filter(g=>g.claim_status==="claimed").length+" 款";
 if(!games.length){$("games").append(element("div","empty","目前還沒有遊戲資料。"));return}
 for(const game of games){
  const card=element("article","card");
  if(game.cover_image_url){const img=element("img","cover");img.src=game.cover_image_url;img.alt=game.title;img.loading="lazy";card.append(img)}
  else card.append(element("div","cover"));
  const body=element("div","body"),row=element("div","title-row"),info=element("div","");
  info.append(element("div","title",game.title||"未命名遊戲"),element("div","platform",game.platform||"未知平台"));
  row.append(info,element("span","status"+(game.claim_status==="claimed"?" done":""),game.claim_status==="claimed"?"已領取":"未領取"));
  body.append(row);
  const links=element("div","links");
  for(const [label,url] of [["商店",game.store_url],["4Gamer 文章",game.article_url]]){const link=safeLink(label,url);if(link)links.append(link)}
  body.append(links);
  if(game.claim_status!=="claimed"){const button=element("button","claim primary",accessToken?"標記已領取":"登入後可手動標記");button.disabled=!accessToken;button.addEventListener("click",()=>markClaimed(game,button));body.append(button)}
  else if(game.claim_source)body.append(element("div","platform",game.claim_source==="fgc"?"由 FGC 自動同步領取":"手動標記領取"));
  card.append(body);$("games").append(card);
 }
}
async function init(){
 try{const config=await fetch(API+"/config").then(r=>r.json());authClientId=config.auth_client_id;
  if(!authClientId){$("login").disabled=true;$("login").textContent="Chi Auth 尚未設定"}
  const games=await fetch(API+"/games").then(r=>r.json());if(!games.games)throw new Error("無法讀取遊戲資料");
  renderGames(games.games);await finishLogin();if(accessToken)renderGames(games.games);
 }catch(error){$("summary").textContent="目前無法載入資料";say(error.message)}
}
$("login").addEventListener("click",login);
init();
</script>
</body>
</html>
