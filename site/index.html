<!doctype html>
<!-- Free Game 網站（fg.chi.qzz.io）— chi-system 重寫版
  - 共用件（tokens/components/navigation/theme.js/icons.svg/logo）由 chi-system 釘版複製進
    本站 chi-system/，來源 commit 見 README；不得熱連結 chi-system main。
  - 主題、圖示、header、頁尾、徽章、資料狀態皆用 chi-system；本站專屬樣式在 fg.css。
  - 本站獨立，不設跨站導覽：header 無「其他站」切換、頁尾無其他站連結。
  - 舊寫法（舊主題 key、舊設計系統熱連結、頁內樣式）已移除。
-->
<html lang="zh-Hant" data-chi-theme="light" data-chi-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Free Game 免費遊戲清單與領取狀態">
  <title>Free Game｜免費遊戲</title>
  <link rel="icon" type="image/png" href="chi-system/logo/fg-w.png">
  <link rel="apple-touch-icon" type="image/png" href="chi-system/logo/fg-w.png">
  <script src="chi-system/theme.js"></script>
  <link rel="stylesheet" href="chi-system/tokens.css">
  <link rel="stylesheet" href="chi-system/components.css">
  <link rel="stylesheet" href="chi-system/navigation.css">
  <link rel="stylesheet" href="fg.css">
</head>
<body>
  <div class="chi-page">
    <a class="fg-skip-link" href="#main-content">跳至主要內容</a>

    <header class="chi-header">
      <div class="chi-header__inner">
        <!-- 1. Logo + 站名 -->
        <a class="chi-header__brand" href="/">
          <img class="chi-header__logo chi-header__logo--light" src="chi-system/logo/fg-b.png" alt="Free Game" width="32" height="32">
          <img class="chi-header__logo chi-header__logo--dark" src="chi-system/logo/fg-w.png" alt="Free Game" width="32" height="32">
          <span>Free Game</span>
        </a>

        <!-- 2. 本站主要導覽：單頁站，只有首頁 -->
        <nav class="chi-header__nav" aria-label="本站導覽">
          <a class="chi-nav-link" href="/" aria-current="page">首頁</a>
        </nav>

        <!-- 3. 主題切換按鈕（三態，見 theme.js） -->
        <button class="chi-header__theme" type="button" data-chi-theme-toggle aria-label="目前色彩模式：跟隨系統，點擊切換">
          <svg class="chi-icon" aria-hidden="true"><use href="chi-system/icons.svg#sun-moon"></use></svg>
        </button>

        <!-- 本站操作：登入（標記領取狀態用） -->
        <button id="login" class="chi-btn chi-btn--primary" type="button"><span class="fg-login__full">使用 Chi Auth 登入</span><span class="fg-login__short">登入</span></button>
      </div>
    </header>

    <main class="chi-main fg-main" id="main-content" tabindex="-1">
      <div class="chi-container">
        <section class="fg-page-header">
          <h1 class="fg-page-title">免費遊戲</h1>
        </section>

        <section class="fg-controls" aria-label="遊戲清單控制">
          <div class="fg-controls__top">
            <div class="chi-field fg-search">
              <label class="chi-field__label" for="search">搜尋遊戲</label>
              <input id="search" class="chi-input" type="search" placeholder="輸入遊戲名稱…" autocomplete="off">
            </div>
            <div class="chi-field">
              <span class="chi-field__label" id="status-filter-label">領取狀態</span>
              <div id="status-filter" class="fg-chip-group" role="group" aria-labelledby="status-filter-label">
                <button class="fg-chip is-active" type="button" data-status="all" aria-pressed="true">全部</button>
                <button class="fg-chip" type="button" data-status="claimed" aria-pressed="false">已領取</button>
                <button class="fg-chip" type="button" data-status="unclaimed" aria-pressed="false">尚未領取</button>
              </div>
            </div>
            <div class="chi-field">
              <span class="chi-field__label" id="platform-filter-label">平台</span>
              <div id="platform-filter" class="fg-chip-group fg-platform-chips" role="group" aria-labelledby="platform-filter-label">
                <button class="fg-chip is-active" type="button" data-platform="all" aria-pressed="true">全部</button>
              </div>
            </div>
          </div>

          <div class="fg-toolbar">
            <div id="summary" class="fg-summary" aria-live="polite">正在讀取遊戲資料…</div>
            <div class="fg-toolbar__right">
              <label class="fg-page-size">
                <span>每頁</span>
                <select id="page-size" class="chi-select" aria-label="每頁顯示數量">
                  <option value="12" selected>12</option>
                  <option value="24">24</option>
                  <option value="48">48</option>
                  <option value="all">全部</option>
                </select>
                <span>筆</span>
              </label>
              <div class="fg-view-toggle" role="group" aria-label="顯示模式">
                <button id="view-grid" class="chi-btn chi-btn--secondary is-active" type="button" aria-pressed="true">
                  <svg class="chi-icon chi-icon--sm" aria-hidden="true"><use href="chi-system/icons.svg#layout-grid"></use></svg>卡片
                </button>
                <button id="view-list" class="chi-btn chi-btn--secondary" type="button" aria-pressed="false">
                  <svg class="chi-icon chi-icon--sm" aria-hidden="true"><use href="chi-system/icons.svg#list"></use></svg>清單
                </button>
              </div>
            </div>
          </div>

          <div id="notice" class="fg-notice" role="status"></div>
        </section>

        <section id="games" class="fg-grid" aria-label="免費遊戲清單"></section>

        <nav id="pagination" class="fg-pagination" aria-label="遊戲清單分頁"></nav>
      </div>
    </main>

    <footer class="chi-footer">
      <div class="chi-footer__inner">
        <p class="chi-footer__meta">Free Game · <span id="fg-version">版本 —</span></p>
      </div>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
